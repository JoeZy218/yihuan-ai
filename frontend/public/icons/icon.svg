<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 游戏手柄主体 -->
  <g transform="translate(256, 240)" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -120 20 C -120 -40, -60 -70, 0 -70 C 60 -70, 120 -40, 120 20 C 120 80, 80 110, 40 110 C 20 110, 10 95, 0 95 C -10 95, -20 110, -40 110 C -80 110, -120 80, -120 20 Z" fill="rgba(102,126,234,0.15)"/>
    <!-- 左侧十字方向键 -->
    <line x1="-70" y1="-10" x2="-30" y2="-10" stroke="#fff" stroke-width="8"/>
    <line x1="-50" y1="-30" x2="-50" y2="10" stroke="#fff" stroke-width="8"/>
    <!-- 右侧两个圆按钮 -->
    <circle cx="50" cy="-25" r="10" fill="#fff" stroke="none"/>
    <circle cx="80" cy="5" r="10" fill="#fff" stroke="none"/>
  </g>
  <!-- 底部"异环AI"文字 -->
  <text x="256" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="700" fill="#ffffff">异环AI</text>
</svg>
